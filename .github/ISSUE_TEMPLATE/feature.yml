name: Feature or improvement
description: Propose user functionality, experience improvements, or technical work
title: "[Feature] "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: Describe the user problem before proposing a technical solution.
  - type: textarea
    id: problem
    attributes:
      label: User problem and objective
      description: Who has what problem, and what should improve after completion?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable and testable conditions.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and out of scope
      placeholder: |
        Included:
        -
        Out of scope:
        -
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - General
        - High risk: financial, tax, or allocation calculation
        - High risk: data source or schema
        - High risk: authentication, security, or deployment
    validations:
      required: true
  - type: textarea
    id: data_semantics
    attributes:
      label: Data and calculation semantics
      description: Explain effects on ACTUAL, estimated, 76W, missing, zero, tax, or allocation formulas. Enter N/A if none.
    validations:
      required: true
  - type: dropdown
    id: ai_scope
    attributes:
      label: AI participation
      options:
        - AI implementation with a human sponsor
        - AI analysis or review only
        - Human-only handling
        - Maintainer decision required
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, conflicts, and expected files
      description: List dependent Issues or PRs, possible claimed-scope conflicts, and shared files.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission confirmation
      options:
        - label: I searched existing Issues and PRs and found no duplicate work.
          required: true
        - label: I did not include secrets, personal data, or production data.
          required: true
