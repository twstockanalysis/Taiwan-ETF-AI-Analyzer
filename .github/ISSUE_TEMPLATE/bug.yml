name: Bug report
description: Report a reproducible website, API, data, or calculation defect
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities, authentication bypasses, tokens, cookies, and suspected data leaks privately through a Security Advisory, not a public Issue.
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What happened? Describe missing values and formal zero separately.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, API, ETF, or date
      description: Do not include tokens, cookies, private-network URLs, or personal data.
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Display or copy issue
        - One feature is unavailable
        - Data or calculation may be incorrect
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public-safe error message or screenshot
      description: Remove secrets, local paths, accounts, and production data before posting.
  - type: dropdown
    id: ai_scope
    attributes:
      label: AI participation
      options:
        - AI may diagnose and fix with a human sponsor
        - AI may perform read-only diagnosis
        - Human-only handling
        - Maintainer decision required
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Report confirmation
      options:
        - label: I searched existing Issues and PRs.
          required: true
        - label: I removed secrets, personal data, tokens, cookies, and non-anonymized production data.
          required: true
