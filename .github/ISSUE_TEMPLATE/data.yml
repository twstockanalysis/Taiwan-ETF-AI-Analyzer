name: ETF data issue or source proposal
description: Report missing data, source differences, pipeline defects, or an official-source proposal
title: "[Data] "
labels: ["type:data", "status:needs-triage", "risk:high"]
body:
  - type: input
    id: subject
    attributes:
      label: ETF, event, or data field
      placeholder: For example, 0050, 2026-08-05 ex-dividend event, or dividend composition
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Current data state
      description: Clearly distinguish missing data, formal zero, estimates, and suspected incorrect values.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Proposed or comparison source
      description: Provide a public official page, document name, publisher, and data date. Do not upload personal or restricted data.
    validations:
      required: true
  - type: dropdown
    id: basis
    attributes:
      label: Data basis
      options:
        - Formal ACTUAL document or notice
        - TWSE or other official market data
        - eFortune fallback or estimated composition
        - Not yet confirmed
    validations:
      required: true
  - type: checkboxes
    id: semantics
    attributes:
      label: Semantic confirmation
      options:
        - label: I did not treat missing data as zero.
          required: true
        - label: I did not describe eFortune estimated realized capital gain as formal 76W.
          required: true
        - label: I provided a data date and verifiable source, or clearly marked them as unconfirmed.
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and regression scope
      placeholder: |
        - [ ] source and provenance retained
        - [ ] missing and zero semantics tested
        - [ ] API and UI contracts updated
    validations:
      required: true
  - type: dropdown
    id: ai_scope
    attributes:
      label: AI participation
      options:
        - AI may assist with local implementation; humans approve official-source status
        - AI comparison and review only
        - Human-only handling
    validations:
      required: true
