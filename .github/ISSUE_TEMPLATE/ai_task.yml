name: AI collaboration task
description: Safely delegate a confirmed task to one AI implementer or reviewer
title: "[AI Task] "
labels: ["ai:allowed", "status:ready"]
body:
  - type: input
    id: sponsor
    attributes:
      label: Human sponsor
      description: GitHub account responsible for scope, authorization, and acceptance.
      placeholder: "@username"
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Concrete objective
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: claimed_scope
    attributes:
      label: Allowed modification scope
      description: List files and modules. Anything not listed is out of scope.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Prohibited actions or actions requiring confirmation
      placeholder: For example, do not change schema, use network access, or push.
    validations:
      required: true
  - type: dropdown
    id: permission
    attributes:
      label: Maximum AI authorization
      options:
        - A0 read-only analysis
        - A1 local implementation and tests
        - A2 branch and commit creation
        - A3 push and PR creation or updates
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Base, dependencies, and other active work
      description: State the base branch and commit, dependent PRs, and claimed scopes that must not overlap.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      placeholder: |
        - focused tests:
        - full regression:
        - manual acceptance:
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Sponsor confirmation
      options:
        - label: I am responsible for requirement decisions and final human acceptance.
          required: true
        - label: This task does not authorize AI to merge, deploy, operate on secrets, or access production data.
          required: true
